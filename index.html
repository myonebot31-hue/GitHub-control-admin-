<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote GitHub Admin Panel</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* Lock Screen Overlay */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .auth-box {
            background: var(--panel-bg); padding: 2rem; border-radius: 12px; border: 1px solid var(--border-color);
            width: 100%; max-width: 400px; text-align: center;
        }
        .auth-box h2 { margin-bottom: 1rem; }
        .auth-box input {
            width: 100%; padding: 0.75rem; background: var(--bg-color); border: 1px solid var(--border-color);
            color: var(--text-main); border-radius: 6px; margin-bottom: 1rem; font-size: 1rem;
        }

        /* Main Dashboard Layout */
        #dashboard { display: none; flex: 1; flex-direction: column; height: 100vh; }
        header {
            background: var(--panel-bg); padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .controls { display: flex; gap: 1rem; align-items: center; }
        select, button {
            background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color);
            padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem;
        }
        button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
        button.primary:hover { background: var(--accent-hover); }

        .main-layout { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar (File Explorer) */
        sidebar {
            width: 320px; background: var(--panel-bg); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; overflow-y: auto; padding: 1rem;
        }
        .section-title { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem; letter-spacing: 0.05em; }
        .file-list { list-style: none; margin-bottom: 1.5rem; }
        .file-item {
            padding: 0.5rem 0.75rem; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;
            font-size: 0.9rem; color: var(--text-muted);
        }
        .file-item:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
        .file-item.active { background: rgba(59, 130, 246, 0.15); color: var(--accent); font-weight: 500; }

        /* Code Editor Panel */
        .editor-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); padding: 1rem; gap: 1rem; overflow: hidden; }
        .editor-header { display: flex; justify-content: space-between; align-items: center; }
        .editor-header span { font-size: 0.95rem; font-weight: 500; color: var(--text-muted); }
        
        textarea#code-editor {
            flex: 1; width: 100%; background: #090d16; color: #38bdf8; border: 1px solid var(--border-color);
            border-radius: 8px; padding: 1rem; font-family: 'Courier New', Courier, monospace; font-size: 0.95rem;
            line-height: 1.5; resize: none; outline: none;
        }
        
        .commit-bar { display: flex; gap: 1rem; align-items: center; }
        .commit-bar input {
            flex: 1; padding: 0.6rem 1rem; background: var(--panel-bg); border: 1px solid var(--border-color);
            color: var(--text-main); border-radius: 6px; outline: none;
        }

        #status-msg { font-size: 0.85rem; margin-left: 1rem; }
    </style>
</head>
<body>

    <!-- AUTHENTICATION LOCK SCREEN -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2>Admin Login</h2>
            <input type="password" id="secret-input" placeholder="Enter Admin Secret Key..." />
            <button class="primary" style="width: 100%;" onclick="unlockDashboard()">Unlock Dashboard</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard">
        <header>
            <h2> Remote Editor</h2>
            <div class="controls">
                <label style="font-size: 0.85rem; color: var(--text-muted);">Account:</label>
                <select id="account-select" onchange="loadRepositories()">
                    <option value="account1">GitHub Account 1</option>
                    <option value="account2">GitHub Account 2</option>
                </select>
                <label style="font-size: 0.85rem; color: var(--text-muted);">Repository:</label>
                <select id="repo-select" onchange="loadRepoFiles()" style="min-width: 200px;">
                    <option value="">Select a repository...</option>
                </select>
            </div>
        </header>

        <div class="main-layout">
            <!-- File Tree Sidebar -->
            <sidebar>
                <div class="section-title">Files & Pages</div>
                <ul id="file-tree" class="file-list">
                    <li style="color: var(--text-muted); font-size: 0.85rem;">Select a repository first.</li>
                </ul>
            </sidebar>

            <!-- Code Editor Workspace -->
            <div class="editor-container">
                <div class="editor-header">
                    <span id="current-file-path">No file selected</span>
                    <span id="status-msg"></span>
                </div>
                <textarea id="code-editor" placeholder="Select a file from the left sidebar to view or edit code..."></textarea>
                <div class="commit-bar">
                    <input type="text" id="commit-msg" placeholder="Commit message (e.g. Update index.html styling)" />
                    <button class="primary" onclick="commitChanges()">Commit Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CHANGE THIS to your actual deployed Render backend service URL
        const BACKEND_URL = 'https://github-control-backend.onrender.com';
        
        let adminKey = '';
        let currentOwner = '';
        let currentRepo = '';
        let currentPath = '';
        let currentBranch = 'main';

        function unlockDashboard() {
            const inputVal = document.getElementById('secret-input').value.trim();
            if (!inputVal) return alert('Please enter your admin secret key.');
            
            adminKey = inputVal;
            // Quick test verification against backend
            loadRepositories().then(success => {
                if (success) {
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'flex';
                } else {
                    alert('Invalid Admin Secret Key.');
                }
            });
        }

        async function apiCall(endpoint, options = {}) {
            headers = {
                'Content-Type': 'application/json',
                'x-admin-key': adminKey,
                ...(options.headers || {})
            };
            const response = await fetch(`${BACKEND_URL}${endpoint}`, { ...options, headers });
            return response;
        }

        async function loadRepositories() {
            const account = document.getElementById('account-select').value;
            try {
                const res = await apiCall(`/api/repos?account=${account}`);
                const data = await res.json();
                
                if (!data.success) return false;

                const repoSelect = document.getElementById('repo-select');
                repoSelect.innerHTML = '<option value="">Select a repository...</option>';
                
                data.repos.forEach(repo => {
                    const opt = document.createElement('option');
                    opt.value = repo.fullName; // format: owner/repo
                    opt.textContent = repo.fullName;
                    repoSelect.appendChild(opt);
                });
                return true;
            } catch (err) {
                console.error(err);
                return false;
            }
        }

        async function loadRepoFiles(path = '') {
            const repoFullName = document.getElementById('repo-select').value;
            if (!repoFullName) return;

            const [owner, repo] = repoFullName.split('/');
            currentOwner = owner;
            currentRepo = repo;
            currentPath = path;
            const account = document.getElementById('account-select').value;

            try {
                const res = await apiCall(`/api/files?account=${account}&owner=${owner}&repo=${repo}&path=${path}`);
                const data = await res.json();

                if (data.success && Array.isArray(data.data)) {
                    renderFileTree(data.data);
                }
            } catch (err) {
                console.error('Error loading files:', err);
            }
        }

        function renderFileTree(files) {
            const fileTree = document.getElementById('file-tree');
            fileTree.innerHTML = '';

            // Option to go back up a directory if inside a folder
            if (currentPath !== '') {
                const parentPath = currentPath.split('/').slice(0, -1).join('/');
                const backItem = document.createElement('li');
                backItem.className = 'file-item';
                backItem.innerHTML = '📁 <strong>.. (Back)</strong>';
                backItem.onclick = () => loadRepoFiles(parentPath);
                fileTree.appendChild(backItem);
            }

            files.forEach(file => {
                const li = document.createElement('li');
                li.className = 'file-item';
                
                if (file.type === 'dir') {
                    li.innerHTML = `📁 ${file.name}`;
                    li.onclick = () => loadRepoFiles(file.path);
                } else {
                    li.innerHTML = `📄 ${file.name}`;
                    li.onclick = () => fetchFileContent(file.path);
                }
                fileTree.appendChild(li);
            });
        }

        async function fetchFileContent(path) {
            const account = document.getElementById('account-select').value;
            try {
                const res = await apiCall(`/api/files?account=${account}&owner=${currentOwner}&repo=${currentRepo}&path=${path}`);
                const data = await res.json();

                if (data.success && data.data.content) {
                    currentPath = path;
                    document.getElementById('current-file-path').textContent = `${currentOwner}/${currentRepo} / ${path}`;
                    
                    // Decode base64 content received from GitHub API
                    const decodedContent = decodeURIComponent(escape(atob(data.data.content)));
                    document.getElementById('code-editor').value = decodedContent;
                    document.getElementById('status-msg').textContent = 'File loaded successfully.';
                    document.getElementById('status-msg').style.color = 'var(--success)';
                }
            } catch (err) {
                console.error('Error fetching file content:', err);
                alert('Could not read file content.');
            }
        }

        async function commitChanges() {
            if (!currentPath) return alert('No file currently open for editing.');
            
            const content = document.getElementById('code-editor').value;
            const message = document.getElementById('commit-msg').value || `Admin update to ${currentPath}`;
            const account = document.getElementById('account-select').value;

            document.getElementById('status-msg').textContent = 'Committing to GitHub...';
            document.getElementById('status-msg').style.color = 'var(--text-muted)';

            try {
                const res = await apiCall('/api/commit-code', {
                    method: 'POST',
                    body: JSON.stringify({
                        account,
                        owner: currentOwner,
                        repo: currentRepo,
                        path: currentPath,
                        content,
                        message,
                        branch: currentBranch
                    })
                });

                const data = await res.json();
                if (data.success) {
                    document.getElementById('status-msg').textContent = 'Successfully committed!';
                    document.getElementById('status-msg').style.color = 'var(--success)';
                    document.getElementById('commit-msg').value = '';
                } else {
                    alert(`Commit failed: ${data.error}`);
                    document.getElementById('status-msg').textContent = 'Commit failed.';
                    document.getElementById('status-msg').style.color = 'var(--danger)';
                }
            } catch (err) {
                console.error('Network error during commit:', err);
                alert('Network error while committing.');
            }
        }
    </script>
</body>
</html>
